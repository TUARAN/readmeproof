name: Weekly compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: "29 2 * * 1"
permissions:
  contents: read
jobs:
  node-matrix:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: npm test
      - run: node src/cli.js README.md --run
      - run: npm pack --dry-run
